<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Automated Link Report</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 600px; }
    .progress-bar { width: 100%; background: #eee; height: 20px; border-radius: 10px; overflow: hidden; margin: 15px 0; }
    .progress-fill { width: 0%; height: 100%; background: #4caf50; transition: width 0.3s; }
    #log { max-height: 200px; overflow-y: auto; background: #f9f9f9; padding: 10px; border: 1px solid #ddd; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>
<body>

  <h3>Sistem Pelaporan Otomatis</h3>
  <button id="startBtn" onclick="processReports()">Mulai Laporkan Semua Link</button>

  <div class="progress-bar">
    <div id="progressFill" class="progress-fill"></div>
  </div>
  <p id="statusText">Status: Siap</p>

  <div id="log"></div>

  <script>
    // Daftar URL target yang ingin dilaporkan
    const reportLinks = [
      "https://www.google.com/local/content/rap/report/submit?t=1&postId=Ci9DQUlRQUNvZENodHljRjlvT2tSM1RYUkRORFUyVUU1VlFqQmtaV1pyY1U5SU1XYxAB&r=2&d=286732320",
      // Tambahkan URL lainnya di sini
    ];

    async function sendReportRequest(url) {
      // Fungsi simulasi/proxy request ke backend atau extension messaging
      // Ganti URL fetch sesuai dengan endpoint backend proxy Anda jika ada
      const response = await fetch(url, { method: 'GET', mode: 'no-cors' });
      return response;
    }

    async function processReports() {
      const btn = document.getElementById('startBtn');
      const progressFill = document.getElementById('progressFill');
      const statusText = document.getElementById('statusText');
      const log = document.getElementById('log');

      btn.disabled = true;
      log.innerHTML = '';
      
      const total = reportLinks.length;

      for (let i = 0; i < total; i++) {
        const url = reportLinks[i];
        statusText.innerText = `Memproses (${i + 1}/${total})...`;
        
        try {
          await sendReportRequest(url);
          log.innerHTML += `<div>✅ Sukses dilaporkan: Link #${i + 1}</div>`;
        } catch (error) {
          log.innerHTML += `<div>❌ Gagal: Link #${i + 1} (${error.message})</div>`;
        }

        // Update progress bar
        const percent = Math.round(((i + 1) / total) * 100);
        progressFill.style.width = percent + '%';

        // Jeda 1.5 detik antar request untuk menghindari rate limiting
        await new Promise(res => setTimeout(res, 1500));
      }

      statusText.innerText = "Selesai! Semua link telah diproses.";
      btn.disabled = false;
    }
  </script>
</body>
</html>
