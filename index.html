<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Dashboard - Realtime</title>
    <!-- Import PapaParse untuk membaca CSV dari Spreadsheet -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-main: #000000;
            --text-muted: #555555;
            --border-color: #e0e0e0;
            --header-bg: #000000;
            --header-text: #ffffff;
            --btn-bg: #1a1a1a;
            --btn-hover: #333333;
            --btn-clicked: #4caf50;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            margin-top: 40px;
        }

        /* Typography */
        h1 {
            font-size: 2.5rem;
            font-weight: 900;
            line-height: 1.1;
            text-transform: uppercase;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }
        
        .underline {
            border-bottom: 5px solid black;
            display: inline-block;
            line-height: 0.9;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 30px;
        }

        /* Table Styles */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            min-width: 600px; 
        }

        th, td {
            padding: 16px 20px;
            font-size: 0.95rem;
        }

        th {
            background-color: var(--header-bg);
            color: var(--header-text);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 0.85rem;
        }

        tr {
            border-bottom: 1px solid var(--border-color);
        }

        tr:last-child {
            border-bottom: 2px solid var(--border-color);
        }

        /* Status styling */
        .status-cell {
            font-weight: bold;
            color: #ccc; 
        }
        .status-cell.done {
            color: #2e7d32; 
        }

        /* Button Styling */
        button {
            background-color: var(--btn-bg);
            color: #fff;
            border: none;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 4px;
            transition: background-color 0.3s ease;
            white-space: nowrap;
        }

        button:hover {
            background-color: var(--btn-hover);
        }

        button.btn-done {
            background-color: var(--btn-clicked);
        }

        /* Mobile adjustments */
        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .container { margin-top: 20px; }
            th, td { padding: 12px 10px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>OUR WORK<br>TRANSFORMS<br><span class="underline">BUSINESSES</span></h1>
    <p class="subtitle">Daftar link report di-generate secara real-time dari Spreadsheet. Klik tombol action untuk membuka link dan mengubah status menjadi Done.</p>

    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>No.</th>
                    <th>Outlet</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <tr>
                    <td colspan="4" style="text-align: center; padding: 30px;">Memuat data dari Spreadsheet...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // ID Spreadsheet dari link yang Anda berikan
    const sheetId = '1RrABTSy3HGQ7lToUsNTiO6r2bhbUd3jMbgBPdXmCt2k';
    // Gunakan URL export format CSV agar mudah dibaca oleh Javascript
    const csvUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv`;

    // Menggunakan library PapaParse untuk mengambil dan membaca file dari Spreadsheet
    Papa.parse(csvUrl, {
        download: true,
        header: true, // Membaca baris pertama (No., Link, Outlet) sebagai nama kolom
        complete: function(results) {
            const data = results.data;
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = ''; // Hapus pesan loading

            let hasData = false;

            data.forEach(row => {
                // Validasi agar baris yang kosong tidak ikut ter-render (misal jika kolom 'Link' di spreadsheet kosong)
                if (!row['Link'] || row['Link'].trim() === '') return;
                
                hasData = true;
                const tr = document.createElement('tr');
                
                // 1. Buat Kolom No.
                const tdNo = document.createElement('td');
                tdNo.textContent = row['No.'] || '-';
                tr.appendChild(tdNo);

                // 2. Buat Kolom Outlet (berdasarkan gambar spreadsheet Anda yang memiliki kolom "Outlet")
                const tdOutlet = document.createElement('td');
                tdOutlet.textContent = row['Outlet'] || 'Unknown';
                tr.appendChild(tdOutlet);

                // 3. Buat Kolom Status (Kosong/Blank default)
                const tdStatus = document.createElement('td');
                tdStatus.className = 'status-cell';
                tdStatus.textContent = '-';
                tr.appendChild(tdStatus);

                // 4. Buat Kolom Action & Button
                const tdAction = document.createElement('td');
                const btn = document.createElement('button');
                btn.textContent = 'Buka Link';
                
                // Logika ketika tombol diklik
                btn.onclick = function() {
                    // Buka link dari spreadsheet ke tab baru
                    window.open(row['Link'], '_blank');

                    // Ubah text dan warna tombol
                    btn.innerText = 'Cek Report';
                    btn.classList.add('btn-done');

                    // Ubah tulisan pada kolom status menjadi Done
                    tdStatus.innerText = 'Done';
                    tdStatus.classList.add('done');
                };
                
                tdAction.appendChild(btn);
                tr.appendChild(tdAction);

                // Masukkan baris ke dalam tabel HTML
                tbody.appendChild(tr);
            });

            // Jika Spreadsheet terdeteksi kosong
            if (!hasData) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align: center;">Tidak ada data ditemukan di Spreadsheet.</td></tr>';
            }
        },
        error: function(err) {
            console.error("Error loading CSV:", err);
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: red;">
                <b>Gagal memuat data!</b><br><br>
                Pastikan akses (Share) Spreadsheet Anda sudah diatur ke <b>"Anyone with the link can view"</b> (Siapa saja yang memiliki tautan dapat melihat) agar bisa dibaca oleh sistem web.
            </td></tr>`;
        }
    });
</script>

</body>
</html>
